<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LHS - SmartPass</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<script src="pwa.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <div class="logo-text">
        <div class="logo-title-row">
          <span class="logo-title">SmartPass</span>
          <svg viewBox="0 0 52 40" class="logo-mark" aria-hidden="true">
            <path d="M4,4 L22,20 L4,36" fill="none" stroke="#1ed17a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M22,4 L40,20 L22,36" fill="none" stroke="#1ed17a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="logo-subtitle">A <span class="raptor">RAPTOR</span> TECHNOLOGIES COMPANY</div>
      </div>
    </div>

    <div class="dev-view">
      <svg viewBox="0 0 24 24" class="dev-icon"><path d="M14.7 6.3a4 4 0 0 1-5.1 5.1L5 16l3 3 4.6-4.6a4 4 0 0 1 5.1-5.1L20 7l-3-3-2.3 2.3z" fill="none" stroke="#8a8f98" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <p class="dev-title">LHS</p>
      <p class="dev-text">This school is under development.<br>Check back soon!</p>
      <a href="/student-signin" id="back-link" class="next-btn dev-back-btn">Go Back</a>
    </div>
  </div>
<script>
  if (localStorage.getItem("smartpass_role") === "teacher") {
    document.getElementById("back-link").href = "/teacher-signin";
  }
</script>
</body>
</html>
