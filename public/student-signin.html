<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPass Student Sign In</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<script src="pwa.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-role="student">
  <div class="login-card">
    <div class="logo">
      <div class="logo-text">
        <div class="logo-title-row">
          <span class="logo-title">SmartPass</span>
          <svg viewBox="0 0 52 40" class="logo-mark" aria-hidden="true">
            <path d="M4,4 L22,20 L4,36" fill="none" stroke="#1ed17a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M22,4 L40,20 L22,36" fill="none" stroke="#1ed17a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="logo-subtitle">A <span class="raptor">RAPTOR</span> TECHNOLOGIES COMPANY</div>
      </div>
    </div>

    <form id="login-form">
      <label for="name" class="field-label">Enter Name</label>
      <input type="text" id="name" name="name" placeholder="Name" autocomplete="name" required>
      <p class="auth-error hidden" role="alert"></p>
      <button type="submit" class="next-btn">Next</button>
      <a href="/teacher-signin" class="switch-link">Are you a teacher? Sign in here</a>
    </form>

    <form id="password-form" class="hidden" autocomplete="off">
      <label for="learn-password" class="field-label">Enter Learn password</label>
      <input type="password" id="learn-password" name="learn-password" class="text-input" placeholder="Learn password" maxlength="10" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <p class="password-hint">Learn followed by 5 numbers, like Learn12345.<br>First time? Pick one in that style and remember it.</p>
      <p class="auth-error hidden" role="alert"></p>
      <button type="submit" class="next-btn">Next</button>
      <a href="#" class="switch-link" id="password-back">Not you? Go back</a>
    </form>

    <div class="loading-view hidden" id="loading-view">
      <div class="spinner"></div>
      <p class="loading-text" id="loading-text">Setting things up&hellip;</p>
    </div>

    <div class="school-view hidden" id="school-view">
      <p class="school-prompt">Select School</p>
      <button type="button" class="school-btn" data-school="WLMS">
        <img src="wlms-logo.png" alt="" class="school-logo">
        WLMS
      </button>
      <button type="button" class="school-btn" data-school="LHS">
        <img src="lhs-logo.png" alt="" class="school-logo">
        LHS
      </button>
    </div>
  </div>

<script src="api.js?v=10"></script>
<script src="script.js?v=10"></script>
</body>
</html>
