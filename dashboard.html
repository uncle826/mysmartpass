<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartPass Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-side"></div>

    <nav class="main-nav">
      <a href="dashboard.html" class="nav-item active">
        <svg viewBox="0 0 24 24" class="nav-icon"><path d="M4 11 12 4l8 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Home</span>
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" class="nav-icon"><rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 9h16M8 3v3M16 3v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Calendar</span>
      </a>
    </nav>

    <div class="topbar-side right">
      <button class="btn btn-outline">
        <svg viewBox="0 0 24 24" class="btn-icon"><rect x="3" y="6" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18" stroke="currentColor" stroke-width="2"/><path d="M8 14h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Schedule Pass
      </button>
      <button class="btn btn-primary" id="create-pass-nav-btn">
        <svg viewBox="0 0 24 24" class="btn-icon"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        Create Pass
      </button>
      <div class="avatar">
        <svg viewBox="0 0 24 24" class="avatar-icon"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6" fill="currentColor"/></svg>
        <span class="avatar-badge">
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </div>
    </div>
  </header>

  <main class="content">
    <section class="welcome-panel">
      <div class="datetime" id="datetime"></div>
      <h1 class="welcome-title">Welcome, <span id="user-name">LUKE</span>!</h1>

      <div class="going-somewhere" id="going-somewhere">
        <img src="walking-icon.png" alt="" class="walk-icon">
        <p class="going-somewhere-text">Going Somewhere?</p>
        <button class="btn btn-primary btn-large" id="create-pass-hero-btn">
          <svg viewBox="0 0 24 24" class="btn-icon"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          Create Pass
        </button>
      </div>

      <div class="active-pass hidden" id="active-pass">
        <div class="pass-card" id="pass-card">
          <div class="pass-card-header">
            <div class="pass-card-title">
              <svg viewBox="0 0 24 24" class="pass-pin-icon"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" fill="#fff"/><circle cx="12" cy="9.5" r="2.6" fill="currentColor"/></svg>
              <span id="active-pass-destination"></span>
            </div>
            <div class="pass-from">
              from <span class="pass-from-badge" id="active-pass-from"></span>
            </div>
          </div>

          <div class="pass-card-divider"><span class="pass-card-divider-dot"></span></div>

          <div class="pass-ring">
            <img src="walking-icon.png" alt="" class="pass-ring-icon" id="active-pass-icon">
            <div class="pass-ring-timer" id="active-pass-timer">00:00</div>
          </div>

          <button class="pass-end-btn" id="end-pass-btn">End Pass</button>
        </div>

        <div class="pass-stats">
          <div class="pass-stat">
            <span class="pass-stat-value" id="stat-today">0</span>
            <span class="pass-stat-label">today</span>
          </div>
          <div class="pass-stat">
            <span class="pass-stat-value" id="stat-week">0</span>
            <span class="pass-stat-label">this week</span>
          </div>
          <div class="pass-stat">
            <span class="pass-stat-value" id="stat-month">0</span>
            <span class="pass-stat-label">this month</span>
          </div>
        </div>
      </div>
    </section>

    <aside class="requests-panel">
      <div class="requests-header">
        <svg viewBox="0 0 24 24" class="requests-icon"><path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3z" fill="currentColor"/></svg>
        <h2>Pass Requests</h2>
      </div>

      <div class="notice" id="notice">
        <svg viewBox="0 0 24 24" class="notice-icon"><rect x="4" y="3" width="14" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h6M8 12h6M8 16h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Turn Browser Notifications On</span>
        <button class="notice-close" id="notice-close" aria-label="Dismiss">&times;</button>
      </div>

      <div class="empty-state">
        <svg viewBox="0 0 24 24" class="check-icon"><path d="M5 13l4 4L19 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>You're all caught up!</span>
      </div>
    </aside>
  </main>

  <div class="modal-overlay hidden" id="pass-modal-overlay">
    <div class="modal">
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>

      <div id="picker-view">
        <div class="modal-field" id="coming-from-field">
          <span class="modal-field-icon dot-icon"></span>
          <input type="text" class="modal-input" id="coming-from" placeholder="Coming from?" autocomplete="off">
        </div>
        <div class="modal-field-divider">
          <span class="dots">&#8942;</span>
        </div>
        <div class="modal-field" id="going-to-field">
          <svg viewBox="0 0 24 24" class="modal-field-icon"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" fill="none" stroke="#4a5568" stroke-width="1.8"/><circle cx="12" cy="9.5" r="2.3" fill="none" stroke="#4a5568" stroke-width="1.8"/></svg>
          <input type="text" class="modal-input" id="going-to" placeholder="Going to?" autocomplete="off">
        </div>

        <div class="modal-list-header">
          <button class="modal-back hidden" id="modal-back" aria-label="Back">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" fill="none" stroke="#2b2560" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <h3 class="modal-list-title" id="modal-list-title">All Rooms</h3>
        </div>
        <div class="modal-room-list" id="modal-room-list"></div>
      </div>

      <div id="duration-view" class="hidden">
        <button class="modal-back" id="duration-back" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" fill="none" stroke="#2b2560" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <div class="duration-dest-row">
          <div class="duration-dest-title">
            <span class="duration-dest-icon" id="duration-dest-icon"></span>
            <span id="duration-dest-name"></span>
          </div>
          <div class="duration-from">
            from <span class="duration-from-badge" id="duration-from"></span>
          </div>
        </div>
        <div class="duration-header-divider"></div>

        <div class="duration-body">
          <div class="duration-slider-col">
            <input type="range" id="duration-slider" class="duration-slider" min="1" max="15" step="1" value="5">
          </div>
          <div class="duration-info">
            <span class="round-trip-pill">Round-trip</span>
            <p class="duration-question">How much time<br>do you need?</p>
            <p class="duration-value" id="duration-value">5 min</p>
          </div>
        </div>

        <button class="duration-start-btn" id="start-pass-btn">
          Start Pass
          <svg viewBox="0 0 24 24" class="btn-icon"><path d="M9 6l6 6-6 6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>

<script src="rooms.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
